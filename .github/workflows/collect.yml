# 急上昇ランキングを定期収集して docs/ を更新し、そのままサーバーへ配信する
name: collect

on:
  schedule:
    # 狙いは「30 分おきの更新」だが、cron をそのまま 30 分おきに置いても実現できない。
    # GitHub のスケジュール実行はベストエフォートで、混雑時は遅れるどころか配信されない。
    # 実測では "0 * * * *"（毎時）でも "7,37 * * * *"（30 分おき）でも、実際に走るのは
    # 約 3 時間に 1 回だけだった（2026-09-16 時点。collect / aimatome の両方で同じ傾向）。
    #
    # そこで 10 分おきに起動し、下の「前回からの経過時間」ステップで 25 分たっていなければ
    # 即座に終了する。走るチャンスを 6 倍に増やしつつ、実際の収集は 30 分おきに保たれる。
    # 空振りの回は 15 秒ほどで終わり、YouTube API も消費しない。
    # （公開リポジトリなので Actions の実行時間は無制限。非公開に戻す場合はこの密な cron を見直すこと）
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:
  # 外部から叩くための入口。GitHub のスケジュール配信が当てにならないため、
  # 外の定期実行サービス（ロリポップの cron など）から 30 分おきにこれを叩く。
  # 叩き方は README の「更新の間隔について」を参照。
  repository_dispatch:
    types: [collect]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 10 分おきの cron と外部トリガー（repository_dispatch）の両方で起動するので、
      # 前回の収集から間がないときはここで終わる。外部サービスが二重に叩いても
      # 余計な収集が走らない。手動実行（workflow_dispatch）だけは間隔を無視する。
      - name: 前回からの経過時間を見る
        id: gate
        env:
          MIN_GAP_MIN: 25
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手動実行のため収集する"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(node -e "try{process.stdout.write(require('./data/history.json').ranAt||'')}catch(e){}")
          if [ -z "$LAST" ]; then
            echo "前回の記録が無いため収集する"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GAP=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 60 ))
          echo "前回の収集: $LAST（${GAP} 分前 / しきい値 ${MIN_GAP_MIN} 分）"
          if [ "$GAP" -ge "$MIN_GAP_MIN" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "間がないので今回は何もしない"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
      # collect.mjs は Node の標準機能だけで動く（esbuild / sharp を使うのは build.mjs だけ）。
      # docs/ の HTML・JS・CSS はビルド済みのものがコミットされていて、site/ を変えたときは
      # deploy.yml が作り直すので、収集のたびに npm ci とビルドを回す必要はない。
      # 30 分おき（1 日 48 回）だと、この 2 ステップだけで Actions の無料枠をかなり消費する。
      - name: Collect
        if: steps.gate.outputs.run == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/collect.mjs
      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # history.json は次回の「伸び」計算に使うので必ずコミットする
          git add docs data/history.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: collect $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      # GITHUB_TOKEN による push は deploy ワークフローを起動しないので、ここでもアップロードする。
      # 収集で変わるのは docs/data/rankings.json だけなので、docs/ 全体ではなく data/ だけを上げる。
      # 毎回 docs/ 全体を上げると時間がかかるうえ、site/ を直したあと docs/ を作り直さずに
      # push した場合、リポジトリ側の古い HTML・JS で公開中のファイルを上書きしてしまう。
      - name: Upload docs/data/ to Lolipop (FTP)
        if: ${{ steps.gate.outputs.run == 'true' && vars.DEPLOY_TARGET == 'lolipop' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USER }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./docs/data/
          server-dir: ${{ vars.LOLIPOP_SERVER_DIR }}data/
          dangerous-clean-slate: false
